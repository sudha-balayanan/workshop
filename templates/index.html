<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
</head>
<body>
    <h1>Hello, World!</h1>

    <form action="{{ url_for('choose') }}" method="get">
        <label for="choice">What would you like to see?</label>
        <select id="choice" name="choice">
            <option value="star">Spinning star</option>
            <option value="game">Car game</option>
        </select>
        <button type="submit">Go</button>
    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
</body>
</html>
