<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Game</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1e1e1e;
            color: #eee;
            font-family: sans-serif;
        }

        canvas {
            border: 4px solid #444;
            max-width: 100%;
        }

        p {
            margin: 12px 0 0;
        }
    </style>
</head>
<body>
    <canvas id="game" width="800" height="600"></canvas>
    <p>Arrow keys / WASD to drive &middot; R to restart</p>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const TILE = 40;

        // T = tree, W = water (solid), G = grass (slow), R = road, F = finish line
        const MAP = [
            "TTTTTTTTTTTTTTTTTTTT",
            "TGGGGGGGGGGGGGGGGGGT",
            "TGRRRRRRRRRRRRRRRRGT",
            "TGRRRRRRRRRRRRRRRRGT",
            "TGRRGGGGGGGGGGGGRRGT",
            "TGRRGTTGGWWWGGGGRRGT",
            "TGFFGGGGGWWWGGGGRRGT",
            "TGRRGGRRRRRRRRRRRRGT",
            "TGRRGGRRRRRRRRRRRRGT",
            "TGRRGGRRGGGGGGGGGGGT",
            "TGRRGGRRGGTTGGGWWGGT",
            "TGRRRRRRGGGGGGGWWGGT",
            "TGRRRRRRGGGGGGGGGGGT",
            "TGGGGGGGGGGGGGGGGGGT",
            "TTTTTTTTTTTTTTTTTTTT",
        ];

        // Must be passed in order before crossing the finish line counts as a lap
        const CHECKPOINTS = [
            { row: 2, col: 16 },  // top-right corner
            { row: 11, col: 6 },  // bottom of the inner bend
        ];

        const keys = {};
        let car, lap, nextCheckpoint, lapStart, bestLap, onFinish;

        function reset() {
            car = { x: 2.5 * TILE + 20, y: 7.5 * TILE, angle: -Math.PI / 2, speed: 0 };
            lap = 0;
            nextCheckpoint = 0;
            lapStart = performance.now();
            onFinish = true;
        }

        function tileAt(x, y) {
            const row = Math.floor(y / TILE);
            const col = Math.floor(x / TILE);
            if (row < 0 || row >= MAP.length || col < 0 || col >= MAP[0].length) return "T";
            return MAP[row][col];
        }

        function isSolid(x, y) {
            const t = tileAt(x, y);
            return t === "T" || t === "W";
        }

        function hitsObstacle(x, y) {
            const r = 10;
            return isSolid(x - r, y - r) || isSolid(x + r, y - r) ||
                   isSolid(x - r, y + r) || isSolid(x + r, y + r);
        }

        function update() {
            const onGrass = tileAt(car.x, car.y) === "G";
            const maxSpeed = onGrass ? 2 : 5;

            if (keys.ArrowUp || keys.w) car.speed += 0.15;
            if (keys.ArrowDown || keys.s) car.speed -= 0.2;
            car.speed *= onGrass ? 0.94 : 0.98;
            car.speed = Math.max(-2, Math.min(maxSpeed, car.speed));

            // Steering only works while moving, and flips when reversing
            const turn = 0.05 * Math.min(1, Math.abs(car.speed) / 2) * Math.sign(car.speed);
            if (keys.ArrowLeft || keys.a) car.angle -= turn;
            if (keys.ArrowRight || keys.d) car.angle += turn;

            const nx = car.x + Math.cos(car.angle) * car.speed;
            const ny = car.y + Math.sin(car.angle) * car.speed;
            if (hitsObstacle(nx, ny)) {
                car.speed *= -0.4;
            } else {
                car.x = nx;
                car.y = ny;
            }

            const row = Math.floor(car.y / TILE);
            const col = Math.floor(car.x / TILE);
            const cp = CHECKPOINTS[nextCheckpoint];
            if (cp && row >= cp.row && row <= cp.row + 1 && col >= cp.col && col <= cp.col + 1) {
                nextCheckpoint++;
            }

            const nowOnFinish = MAP[row][col] === "F";
            if (nowOnFinish && !onFinish && nextCheckpoint === CHECKPOINTS.length) {
                const time = performance.now() - lapStart;
                if (!bestLap || time < bestLap) bestLap = time;
                lap++;
                nextCheckpoint = 0;
                lapStart = performance.now();
            }
            onFinish = nowOnFinish;
        }

        function drawMap() {
            for (let row = 0; row < MAP.length; row++) {
                for (let col = 0; col < MAP[row].length; col++) {
                    const t = MAP[row][col];
                    const x = col * TILE;
                    const y = row * TILE;

                    ctx.fillStyle = t === "R" || t === "F" ? "#555" : t === "W" ? "#2a7fd4" : "#3d8b3d";
                    ctx.fillRect(x, y, TILE, TILE);

                    if (t === "F") {
                        // Checkered finish line
                        const s = TILE / 4;
                        for (let i = 0; i < 4; i++) {
                            for (let j = 0; j < 2; j++) {
                                ctx.fillStyle = (i + j) % 2 ? "#fff" : "#000";
                                ctx.fillRect(x + i * s, y + TILE / 2 - s + j * s, s, s);
                            }
                        }
                    } else if (t === "T") {
                        ctx.fillStyle = "#1f5e1f";
                        ctx.beginPath();
                        ctx.arc(x + TILE / 2, y + TILE / 2, TILE / 2 - 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }

        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            ctx.fillStyle = "#d62828";
            ctx.fillRect(-14, -8, 28, 16);
            ctx.fillStyle = "#9ad0ff";
            ctx.fillRect(4, -6, 6, 12);   // windshield
            ctx.fillStyle = "#111";
            ctx.fillRect(-12, -10, 7, 3); // wheels
            ctx.fillRect(-12, 7, 7, 3);
            ctx.fillRect(5, -10, 7, 3);
            ctx.fillRect(5, 7, 7, 3);
            ctx.restore();
        }

        function formatTime(ms) {
            return (ms / 1000).toFixed(2) + "s";
        }

        function drawHud() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(10, 10, 190, 70);
            ctx.fillStyle = "#fff";
            ctx.font = "16px sans-serif";
            ctx.fillText("Laps: " + lap, 20, 32);
            ctx.fillText("Time: " + formatTime(performance.now() - lapStart), 20, 52);
            ctx.fillText("Best: " + (bestLap ? formatTime(bestLap) : "--"), 20, 72);
        }

        function loop() {
            update();
            drawMap();
            drawCar();
            drawHud();
            requestAnimationFrame(loop);
        }

        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if (e.key === "r") reset();
            if (e.key.startsWith("Arrow")) e.preventDefault();
        });
        window.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });

        reset();
        loop();
    </script>
</body>
</html>
